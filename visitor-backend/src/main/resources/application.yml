server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/visitor_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ROOT123
  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.visitor.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: VmlzaXRvclN5c3RlbVNlY3JldEtleUZvckpXVDIwMjQ=
  expiration: 86400000

ai:
  review:
    enabled: false
  deepseek:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-chat
    temperature: 0.1
    max-tokens: 1024
    connect-timeout: 5000
    read-timeout: 30000
    max-attempts: 3

logging:
  level:
    com.visitor: debug
